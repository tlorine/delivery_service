name: Images

# Container images for production (docs/architecture/deployment.md), published to this repository's GHCR.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "apps/web-app/**"
      - "apps/admin/**"
      - "packages/**"
      - "docker/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: web-app
            context: .
            file: docker/web-app/Dockerfile
          - name: admin
            context: .
            file: docker/admin/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:main
            ghcr.io/${{ github.repository }}/${{ matrix.name }}:${{ github.sha }}
