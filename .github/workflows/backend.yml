name: Backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docker/postgres/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docker/postgres/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: delivery
          POSTGRES_PASSWORD: delivery
          POSTGRES_DB: delivery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U delivery" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://delivery_app:delivery_app@localhost:5432/delivery_test
      TEST_MIGRATOR_DATABASE_URL: postgresql+asyncpg://delivery:delivery@localhost:5432/delivery_test
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Create application role (no table ownership, no BYPASSRLS)
        env:
          PGPASSWORD: delivery
        run: psql -h localhost -U delivery -d delivery_test -c "CREATE ROLE delivery_app LOGIN PASSWORD 'delivery_app' NOBYPASSRLS"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Typecheck
        run: uv run mypy
      - name: OpenAPI contract is committed and current
        run: uv run python scripts/export_openapi.py --check
      - name: Migrations have no drift from models
        env:
          ALEMBIC_DATABASE_URL: ${{ env.TEST_MIGRATOR_DATABASE_URL }}
        run: uv run alembic upgrade head && uv run alembic check
      - name: Tests (unit + PostgreSQL integration)
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t delivery-backend:ci backend
